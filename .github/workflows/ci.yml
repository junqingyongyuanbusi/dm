name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read


env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .

  test:
    name: Pytest and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0 # pg17
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: social_reply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d social_reply_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005 # 8.8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TESTING: "true"
      DATABASE_URL: postgresql+asyncpg://dev:dev@localhost:5432/social_reply_test
      REDIS_URL: redis://localhost:6379/0
      PLATFORM_SECRET_KEYS: Wm5wbamjBFvTmkGIU2NskIKCrJfsb4AdUBDZR-m1-CM=
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-groups
      - name: Verify migration chain and metadata
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic check
          head_revision="$(uv run alembic heads)"
          current_revision="$(uv run alembic current)"
          test -n "$head_revision"
          test -n "$current_revision"
          test "$head_revision" = "$current_revision"
      - run: uv run pytest -q

  image:
    name: Production image
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify release and rollback shell contracts
        run: |
          set -euo pipefail
          bash -n \
            scripts/publish_railway_release.sh \
            scripts/verify_production_image.sh \
            scripts/verify_migration_compatible_rollback.sh \
            scripts/rollback_railway_migration_compatible.sh
          test -x scripts/publish_railway_release.sh
          test -x scripts/verify_production_image.sh
          test -x scripts/verify_migration_compatible_rollback.sh
          test -x scripts/rollback_railway_migration_compatible.sh
      - name: Build linux/amd64 production image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --build-arg "RAILWAY_GIT_COMMIT_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=1970-01-01T00:00:00Z" \
            --build-arg "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" \
            --tag reply-core-ci:${GITHUB_SHA} \
            --load \
            .
          test "$(docker image inspect reply-core-ci:${GITHUB_SHA} --format '{{index .Config.Labels "com.nexory.reply-core.review-outbox-contract"}}')" = "review-outbox-dual-read-v1"
      - name: Build migration-compatible rollback contract image
        run: |
          set -euo pipefail
          base_digest="sha256:$(printf '0%.0s' {1..64})"
          docker build \
            --platform linux/amd64 \
            --file deploy/Dockerfile.migration-compatible-rollback \
            --build-arg "BASE_IMAGE=reply-core-ci:${GITHUB_SHA}" \
            --build-arg "APP_REVISION=${GITHUB_SHA}" \
            --build-arg "TARGET_RELEASE_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=1970-01-01T00:00:00Z" \
            --build-arg "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg "BASE_DIGEST=${base_digest}" \
            --build-arg "BASE_REVIEW_OUTBOX_CAPABILITY=review-outbox-dual-read-v1" \
            --tag reply-core-compat-ci:${GITHUB_SHA} \
            .
          test "$(docker image inspect reply-core-compat-ci:${GITHUB_SHA} --format '{{index .Config.Labels "com.nexory.reply-core.database-head"}}')" = "a7c3e9d1b624"
          test "$(docker image inspect reply-core-compat-ci:${GITHUB_SHA} --format '{{index .Config.Labels "com.nexory.reply-core.rollback-target-release"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect reply-core-compat-ci:${GITHUB_SHA} --format '{{index .Config.Labels "com.nexory.reply-core.review-outbox-contract"}}')" = "review-outbox-dual-read-v1"
          test "$(docker run --rm --entrypoint alembic reply-core-compat-ci:${GITHUB_SHA} heads | awk '{print $1; exit}')" = "a7c3e9d1b624"
      - name: Verify image contract
        run: scripts/verify_production_image.sh "reply-core-ci:${GITHUB_SHA}" "$GITHUB_SHA"
      - name: Export verified production image
        run: |
          set -euo pipefail
          docker save "reply-core-ci:${GITHUB_SHA}" | gzip -1 >"/tmp/reply-core-${GITHUB_SHA}.tar.gz"
      - name: Upload verified production image
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: verified-production-image-${{ github.sha }}
          path: /tmp/reply-core-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-ghcr:
    name: Publish GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [image]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Download verified production image
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: verified-production-image-${{ github.sha }}
          path: /tmp
      - name: Load verified production image
        run: gzip -dc "/tmp/reply-core-${GITHUB_SHA}.tar.gz" | docker load
      - name: Publish verified image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_IMAGE: ghcr.io/junqingyongyuanbusi/reply-core
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          local_image="reply-core-ci:${GITHUB_SHA}"
          sha_ref="${GHCR_IMAGE}:${GITHUB_SHA}"
          if docker buildx imagetools inspect "$sha_ref" >/dev/null 2>&1; then
            docker pull "$sha_ref"
            scripts/verify_production_image.sh "$sha_ref" "$GITHUB_SHA"
            digest="$(docker buildx imagetools inspect "$sha_ref" | awk '/^Digest:/ {print $2; exit}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "Immutable SHA tag already exists and passed the full image contract"
          else
            temporary_ref="${GHCR_IMAGE}:ci-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker tag "$local_image" "$temporary_ref"
            docker push "$temporary_ref"
            verified_digest="$(docker buildx imagetools inspect "$temporary_ref" | awk '/^Digest:/ {print $2; exit}')"
            [[ "$verified_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$sha_ref" \
              "${GHCR_IMAGE}@${verified_digest}"
            digest="$(docker buildx imagetools inspect "$sha_ref" | awk '/^Digest:/ {print $2; exit}')"
            test "$digest" = "$verified_digest"
          fi

          mkdir -p dist
          jq -n \
            --arg git_sha "$GITHUB_SHA" \
            --arg image_repository "$GHCR_IMAGE" \
            --arg sha_ref "$sha_ref" \
            --arg digest "$digest" \
            '{git_sha: $git_sha, image_repository: $image_repository,
              sha_ref: $sha_ref, digest: $digest}' \
            >"dist/ghcr-image-${GITHUB_SHA}.json"
          echo "Published immutable $sha_ref at $digest; latest remains release-controlled"
      - name: Upload GHCR image evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ghcr-image-${{ github.sha }}
          path: dist/ghcr-image-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 90
