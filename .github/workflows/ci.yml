name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .

  test:
    name: Pytest and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0 # pg17
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: social_reply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d social_reply_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005 # 8.8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TESTING: "true"
      DATABASE_URL: postgresql+asyncpg://dev:dev@localhost:5432/social_reply_test
      REDIS_URL: redis://localhost:6379/0
      PLATFORM_SECRET_KEYS: Wm5wbamjBFvTmkGIU2NskIKCrJfsb4AdUBDZR-m1-CM=
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-groups
      - name: Verify migration chain and metadata
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic check
          head_revision="$(uv run alembic heads)"
          current_revision="$(uv run alembic current)"
          test -n "$head_revision"
          test -n "$current_revision"
          test "$head_revision" = "$current_revision"
      - run: uv run pytest -q

  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify release and rollback shell contracts
        run: |
          set -euo pipefail
          bash -n \
            scripts/publish_railway_release.sh \
            scripts/verify_migration_compatible_rollback.sh \
            scripts/rollback_railway_migration_compatible.sh
          test -x scripts/verify_migration_compatible_rollback.sh
          test -x scripts/rollback_railway_migration_compatible.sh
      - name: Build linux/amd64 production image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --build-arg "RELEASE_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=1970-01-01T00:00:00Z" \
            --build-arg "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" \
            --tag reply-core-ci:${GITHUB_SHA} \
            --load \
            .
      - name: Build migration-compatible rollback contract image
        run: |
          set -euo pipefail
          base_digest="sha256:$(printf '0%.0s' {1..64})"
          docker build \
            --platform linux/amd64 \
            --file deploy/Dockerfile.migration-compatible-rollback \
            --build-arg "BASE_IMAGE=reply-core-ci:${GITHUB_SHA}" \
            --build-arg "APP_REVISION=${GITHUB_SHA}" \
            --build-arg "TARGET_RELEASE_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=1970-01-01T00:00:00Z" \
            --build-arg "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg "BASE_DIGEST=${base_digest}" \
            --tag reply-core-compat-ci:${GITHUB_SHA} \
            .
          test "$(docker image inspect reply-core-compat-ci:${GITHUB_SHA} --format '{{index .Config.Labels "com.nexory.reply-core.database-head"}}')" = "a6f1c3d8e205"
          test "$(docker image inspect reply-core-compat-ci:${GITHUB_SHA} --format '{{index .Config.Labels "com.nexory.reply-core.rollback-target-release"}}')" = "${GITHUB_SHA}"
          test "$(docker run --rm --entrypoint alembic reply-core-compat-ci:${GITHUB_SHA} heads | awk '{print $1; exit}')" = "a6f1c3d8e205"
      - name: Verify image contract
        run: |
          set -euo pipefail
          image="reply-core-ci:${GITHUB_SHA}"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "appuser"
          test "$(docker run --rm --entrypoint id "$image" -u)" = "10001"
          test "$(docker run --rm --entrypoint id "$image" -g)" = "10001"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = "amd64"
          docker run --rm --entrypoint sh "$image" -c 'test ! -w /app/src && test ! -w /app/.venv'
          docker run --rm --entrypoint sh "$image" -c 'test ! -e /app/tests && test ! -e /app/docs && test ! -e /app/scripts/publish_railway_release.sh'
          docker run --rm \
            -e TESTING=true \
            -e PLATFORM_SECRET_KEYS=Wm5wbamjBFvTmkGIU2NskIKCrJfsb4AdUBDZR-m1-CM= \
            --entrypoint python \
            "$image" \
            -c 'import apps.api.main, apps.worker.main, apps.scheduler.main, scripts.prepare_database; print("runtime imports ok")'
          docker run --rm \
            -e TESTING=true \
            -e PLATFORM_SECRET_KEYS=Wm5wbamjBFvTmkGIU2NskIKCrJfsb4AdUBDZR-m1-CM= \
            --entrypoint alembic \
            "$image" \
            heads
          if docker run --rm "$image" >/tmp/reply-core-missing-role.log 2>&1; then
            cat /tmp/reply-core-missing-role.log
            exit 1
          fi
          grep -q "SERVICE_ROLE is required" /tmp/reply-core-missing-role.log
          if docker run --rm -e SERVICE_ROLE=invalid "$image" >/tmp/reply-core-invalid-role.log 2>&1; then
            cat /tmp/reply-core-invalid-role.log
            exit 1
          fi
          grep -q "unknown SERVICE_ROLE" /tmp/reply-core-invalid-role.log
