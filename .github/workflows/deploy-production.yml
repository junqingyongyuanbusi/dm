name: Production Deploy

on:
  push:
    branches: [dev]

permissions:
  actions: read
  contents: read

concurrency:
  group: production-source-release
  cancel-in-progress: false

env:
  CI_TIMEOUT_SECONDS: "1800"

jobs:
  deploy:
    name: API → Worker → Scheduler
    if: vars.RAILWAY_SOURCE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve release SHA
        id: release
        env:
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$PUSH_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'release_sha=%s\n' "$PUSH_SHA" >>"$GITHUB_OUTPUT"

      - name: Skip stale queued push
        id: freshness
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          current_dev_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
          if [[ "$current_dev_sha" != "$RELEASE_SHA" ]]; then
            echo "stale=true" >>"$GITHUB_OUTPUT"
            echo "Skipping queued stale release $RELEASE_SHA; dev is now $current_dev_sha"
          else
            echo "stale=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Wait for exact CI run
        if: steps.freshness.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + CI_TIMEOUT_SECONDS))
          while (( SECONDS < deadline )); do
            runs="$(gh api \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&event=push&per_page=20")"
            count="$(jq -r '.workflow_runs | length' <<<"$runs")"
            if [[ "$count" -eq 0 ]]; then
              sleep 10
              continue
            fi
            if jq -e '.workflow_runs | any(.status == "completed" and .conclusion != "success")' \
              >/dev/null <<<"$runs"; then
              jq -r '.workflow_runs[] | "CI \(.status)/\(.conclusion): \(.html_url)"' <<<"$runs"
              exit 1
            fi
            if jq -e '.workflow_runs | all(.status == "completed" and .conclusion == "success")' \
              >/dev/null <<<"$runs"; then
              jq -r '.workflow_runs[] | "CI success: \(.html_url)"' <<<"$runs"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for CI on $RELEASE_SHA" >&2
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.freshness.outputs.stale != 'true'
        with:
          ref: ${{ steps.release.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.freshness.outputs.stale != 'true'
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: steps.freshness.outputs.stale != 'true'
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install production validation dependencies
        if: steps.freshness.outputs.stale != 'true'
        run: uv sync --frozen --no-dev

      - name: Recheck freshness before production mutation
        id: final-freshness
        if: steps.freshness.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          current_dev_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
          if [[ "$current_dev_sha" != "$RELEASE_SHA" ]]; then
            echo "stale=true" >>"$GITHUB_OUTPUT"
            echo "Skipping stale release before production mutation: $RELEASE_SHA; dev is $current_dev_sha"
          else
            echo "stale=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Deploy exact source commit
        if: steps.freshness.outputs.stale != 'true' && steps.final-freshness.outputs.stale != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PRODUCTION_DEPLOY_AUTHORIZED: "true"
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$RAILWAY_TOKEN"
          scripts/publish_railway_release.sh "--sha=${RELEASE_SHA}"

      - name: Upload release evidence
        if: always() && steps.freshness.outputs.stale != 'true' && steps.final-freshness.outputs.stale != 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: source-release-${{ steps.release.outputs.release_sha }}
          path: dist/source-release-${{ steps.release.outputs.release_sha }}.json
          if-no-files-found: warn
          retention-days: 90
