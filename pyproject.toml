[project]
name = "social-reply"
version = "0.1.0"
description = "社媒自动回复核心（Reply Core）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "dramatiq[redis]>=1.17",
    "httpx>=0.27",
    "authlib>=1.3",
    "cryptography>=43.0",
    "pgvector>=0.5.0",
    "xdk==0.9.0",
    "chatxdk==0.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "greenlet>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_reply"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: 需要 docker compose 中的 PG/Redis"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["social_reply", "apps"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated migrations: keep as produced (long lines / import order)
"migrations/versions/*" = ["E501", "I001"]
# Embedded server-rendered admin HTML/CSS is intentionally kept local to its route module.
"src/social_reply/application/account_management/admin.py" = ["E501"]
"src/social_reply/application/account_management/admin_console.py" = ["E501"]
